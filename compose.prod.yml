# Production overlay deliberately contains no build directives or source bind mounts.
# Pull/load immutable image digests first, then use:
# docker compose --env-file /secure/path/progyx.env -f compose.yml -f compose.prod.yml up -d --wait --no-build
x-production-backend-env: &production-backend-env
  APP_ENV: production
  SECRET_KEY: ${SECRET_KEY:?Set a strong production SECRET_KEY}
  JWT_SIGNING_KEY_ID: ${JWT_SIGNING_KEY_ID:?Set the active JWT signing key id}
  JWT_SIGNING_KEYS: ${JWT_SIGNING_KEYS:?Set the JWT signing keyring}
  CLIENT_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public https origin}
  FRONTEND_PUBLIC_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public https origin}
  POSTGRES_PASSWORD_FILE: /run/app-secrets/postgres_password
  REDIS_PASSWORD_FILE: /run/app-secrets/redis_password
  CODE_JUDGE_RUNNER_TOKEN_FILE: /run/app-secrets/judge_runner_token
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_SAMESITE: Strict
  SUPERADMIN_BOOTSTRAP: "false"
  ENABLE_DEMO_DATA: "false"
  TRUST_PROXY: "true"
  SEND_MAIL: "true"
  EMAIL_DRY_RUN: "false"
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-unisender_go}
  UNISENDER_GO_API_KEY: ${UNISENDER_GO_API_KEY:?Set the transactional email provider key}
  EMAIL_FROM: ${EMAIL_FROM:?Set the verified transactional sender address}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Progyx}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
  LEGAL_DOCUMENTS_VERSION: ${LEGAL_DOCUMENTS_VERSION:?Set the approved legal documents version}
  MAX_CONTENT_LENGTH_BYTES: ${MAX_CONTENT_LENGTH_BYTES:-8388608}
  READINESS_REQUIRE_REDIS: "true"
  READINESS_REQUIRE_JUDGE: "true"
  READINESS_JUDGE_TIMEOUT_MS: ${READINESS_JUDGE_TIMEOUT_MS:-500}
  PARENT_PASSWORD_SETUP_TOKEN_TTL_MINUTES: ${PARENT_PASSWORD_SETUP_TOKEN_TTL_MINUTES:-1440}
  ENABLE_AUDIT_LOG_DAILY_EXPORT_THREAD: "false"
  ENABLE_PARENT_WEEKLY_PROGRESS_EMAIL_THREAD: "false"

services:
  db:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to the immutable release digest}
  judge-gateway:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to the immutable release digest}
  backend-init:
    # Do not import the repository-local development .env in production.
    env_file: !reset []
    user: "0:0"
    entrypoint: ["/usr/local/bin/backend-entrypoint"]
    environment: *production-backend-env
    # Production deploys migrate only after both local and encrypted off-site
    # snapshots have succeeded. Demo/content seeding is an explicit operation.
    command: ["python", "-m", "flask", "--app", "run.py", "upgrade-db"]
    depends_on:
      pre-migration-offsite-backup: {condition: service_completed_successfully}
    cap_add: [CHOWN, SETUID, SETGID]
  backend:
    # Do not import the repository-local development .env in production.
    env_file: !reset []
    user: "0:0"
    entrypoint: ["/usr/local/bin/backend-entrypoint"]
    # Compose ignores the image CMD when an entrypoint is overridden, so keep
    # the production server invocation explicit here.
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "3", "--threads", "2", "--timeout", "45", "--graceful-timeout", "30", "--max-requests", "1000", "--max-requests-jitter", "100", "--access-logfile", "-", "--error-logfile", "-", "--capture-output", "run:app"]
    environment: *production-backend-env
    cap_add: [CHOWN, SETUID, SETGID]
  frontend:
    environment:
      APP_ENV: production
      INTERNAL_API_URL: http://backend:8000/api
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public https origin}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL to the public https origin}
      BFF_MAX_REQUEST_BODY_BYTES: ${BFF_MAX_REQUEST_BODY_BYTES:-8388608}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:?Set the approved operator name}
      LEGAL_OPERATOR_TAX_ID: ${LEGAL_OPERATOR_TAX_ID:?Set the approved operator tax ID}
      LEGAL_OPERATOR_REGISTRATION_ID: ${LEGAL_OPERATOR_REGISTRATION_ID:?Set the approved operator registration ID}
      LEGAL_OPERATOR_ADDRESS: ${LEGAL_OPERATOR_ADDRESS:?Set the approved operator address}
      LEGAL_SUPPORT_EMAIL: ${LEGAL_SUPPORT_EMAIL:?Set the public support email}
      LEGAL_SUPPORT_PHONE: ${LEGAL_SUPPORT_PHONE:?Set the public support phone}
      LEGAL_DOCUMENTS_VERSION: ${LEGAL_DOCUMENTS_VERSION:?Set the approved legal documents version}
      LEGAL_DOCUMENTS_EFFECTIVE_DATE: ${LEGAL_DOCUMENTS_EFFECTIVE_DATE:-}
      LEGAL_PRIVACY_CONTENT: ${LEGAL_PRIVACY_CONTENT:?Set the approved privacy policy text}
      LEGAL_TERMS_CONTENT: ${LEGAL_TERMS_CONTENT:?Set the approved user agreement text}
      LEGAL_PERSONAL_DATA_CONTENT: ${LEGAL_PERSONAL_DATA_CONTENT:?Set the approved personal-data consent text}
      TOURNAMENT_YANDEX_PUBLIC_URL: ${TOURNAMENT_YANDEX_PUBLIC_URL:?Set the owned Yandex Disk tournament source}
      TOURNAMENT_DATA_REFRESH_INTERVAL_SECONDS: ${TOURNAMENT_DATA_REFRESH_INTERVAL_SECONDS:-1200}
  ingress:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to the immutable release digest}
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to the production hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for certificate lifecycle alerts}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend: {condition: service_healthy}
    networks: [edge_net]
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=32m"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: ${INGRESS_MEMORY_LIMIT:-256m}
    cpus: ${INGRESS_CPU_LIMIT:-0.5}
    pids_limit: 128
  db-backup:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to the immutable release digest}
    # The release-scoped one-shot dump owns the pre-migration window. Start
    # the recurring loop only after the new application is healthy.
    depends_on:
      backend: {condition: service_healthy}
  pre-migration-backup:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to the immutable release digest}
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: codequest
      PGUSER: codequest
      PGPASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "14"
    secrets: [postgres_password]
    volumes:
      - postgres_backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "set -eu; export PGPASSWORD=\"$$(tr -d '\\r' < \"$$PGPASSWORD_FILE\")\"; sh /usr/local/bin/backup.sh; date +%s > /backups/.last-pre-migration-success"]
    depends_on:
      db: {condition: service_healthy}
    networks: [data_net]
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
  pre-migration-offsite-backup:
    image: ${RESTIC_IMAGE:?Set RESTIC_IMAGE to the immutable release digest}
    restart: "no"
    entrypoint: ["/bin/sh", "/usr/local/bin/offsite-backup.sh"]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set an encrypted off-host RESTIC_REPOSITORY}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/backup_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/backup_secret_access_key
      RESTIC_AUTO_INIT: ${RESTIC_AUTO_INIT:-false}
      OFFSITE_BACKUP_RUN_ONCE: "true"
      RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY:-14}
      RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY:-8}
      RESTIC_KEEP_MONTHLY: ${RESTIC_KEEP_MONTHLY:-12}
      BACKUP_HOST_LABEL: ${BACKUP_HOST_LABEL:-progyx-production}
    secrets: [restic_password, backup_access_key_id, backup_secret_access_key]
    volumes:
      - postgres_backups:/data/postgres:ro
      - media_data:/data/media:ro
      - audit_data:/data/audit:ro
      - restic_cache:/root/.cache/restic
      - offsite_repository:/offsite
      - ./scripts/offsite-backup.sh:/usr/local/bin/offsite-backup.sh:ro
    depends_on:
      pre-migration-backup: {condition: service_completed_successfully}
    networks: [backup_egress_net]
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
  offsite-backup:
    image: ${RESTIC_IMAGE:?Set RESTIC_IMAGE to the immutable release digest}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/offsite-backup.sh"]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set an encrypted off-host RESTIC_REPOSITORY}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/backup_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/backup_secret_access_key
      RESTIC_AUTO_INIT: ${RESTIC_AUTO_INIT:-false}
      OFFSITE_BACKUP_INTERVAL_SECONDS: ${OFFSITE_BACKUP_INTERVAL_SECONDS:-86400}
      OFFSITE_BACKUP_MAX_AGE_SECONDS: ${OFFSITE_BACKUP_MAX_AGE_SECONDS:-90000}
      RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY:-14}
      RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY:-8}
      RESTIC_KEEP_MONTHLY: ${RESTIC_KEEP_MONTHLY:-12}
      BACKUP_HOST_LABEL: ${BACKUP_HOST_LABEL:-progyx-production}
    secrets: [restic_password, backup_access_key_id, backup_secret_access_key]
    volumes:
      - postgres_backups:/data/postgres:ro
      - media_data:/data/media:ro
      - audit_data:/data/audit:ro
      - restic_cache:/root/.cache/restic
      - offsite_repository:/offsite
      - ./scripts/offsite-backup.sh:/usr/local/bin/offsite-backup.sh:ro
    depends_on:
      db-backup: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/offsite-last-success && age=$$(($$(date +%s)-$$(cat /tmp/offsite-last-success))) && test \"$$age\" -le \"$$OFFSITE_BACKUP_MAX_AGE_SECONDS\""]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 10m
    networks: [backup_egress_net]
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: ${OFFSITE_BACKUP_MEMORY_LIMIT:-512m}
    cpus: ${OFFSITE_BACKUP_CPU_LIMIT:-0.5}
    pids_limit: 128

volumes:
  caddy_data:
  caddy_config:
  restic_cache:
  offsite_repository:

networks:
  backup_egress_net:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE_HOST:?Set POSTGRES_PASSWORD_FILE_HOST to an external secret file}
  redis_password:
    file: ${REDIS_PASSWORD_FILE_HOST:?Set REDIS_PASSWORD_FILE_HOST to an external secret file}
  judge_runner_token:
    file: ${JUDGE_RUNNER_TOKEN_FILE_HOST:?Set JUDGE_RUNNER_TOKEN_FILE_HOST to an external secret file}
  restic_password:
    file: ${RESTIC_PASSWORD_FILE_HOST:?Set RESTIC_PASSWORD_FILE_HOST to an external secret file}
  backup_access_key_id:
    file: ${BACKUP_ACCESS_KEY_ID_FILE_HOST:?Set BACKUP_ACCESS_KEY_ID_FILE_HOST to an external secret file}
  backup_secret_access_key:
    file: ${BACKUP_SECRET_ACCESS_KEY_FILE_HOST:?Set BACKUP_SECRET_ACCESS_KEY_FILE_HOST to an external secret file}
