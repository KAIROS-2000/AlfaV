name: release-images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag never bypasses the same tests, dependency audits, source scans,
  # production Compose smoke and judge isolation checks required for a PR.
  quality-gate:
    uses: ./.github/workflows/ci.yml

  protected-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - name: Require release commit on the protected main line
        run: |
          [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          fi

  build-scan:
    needs: [quality-gate, protected-commit]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: backend
            context: .
            dockerfile: ./backend/Dockerfile
          - name: judge-runner
            context: .
            dockerfile: ./judge_runner/Dockerfile
          - name: postgres
            context: ./postgres
            dockerfile: ./postgres/Dockerfile
          - name: caddy
            context: ./caddy
            dockerfile: ./caddy/Dockerfile
          - name: restic
            context: ./restic
            dockerfile: ./restic/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/progyx-${{ matrix.name }}:candidate-${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,scope=release-${{ matrix.name }},mode=max
      - name: Scan candidate before publication
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/progyx-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          docker run --rm -v trivy-cache:/root/.cache/trivy
          -v "$HOME/.docker:/root/.docker:ro"
          aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e
          image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed
          "$IMAGE@$DIGEST"
      - name: Record scanned candidate digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/progyx-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > "${{ matrix.name }}-image.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.name }}
          path: ${{ matrix.name }}-image.txt
          retention-days: 7

  publish:
    needs: build-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidate-*
          merge-multiple: true
      - name: Validate complete candidate set
        run: |
          test "$(find . -maxdepth 1 -name '*-image.txt' -type f | wc -l)" -eq 6
          for name in frontend backend judge-runner postgres caddy restic; do
            test -s "${name}-image.txt"
            grep -Eq "^ghcr\.io/.+/progyx-${name}@sha256:[0-9a-f]{64}$" "${name}-image.txt"
          done
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign every scanned digest before exposing release tags
        run: |
          for name in frontend backend judge-runner postgres caddy restic; do
            cosign sign --yes "$(cat "${name}-image.txt")"
          done
      - name: Promote the scanned digests without rebuilding
        run: |
          for name in frontend backend judge-runner postgres caddy restic; do
            ref="$(cat "${name}-image.txt")"
            image="${ref%@*}"
            docker buildx imagetools create \
              --tag "${image}:${GITHUB_REF_NAME}" \
              --tag "${image}:sha-${GITHUB_SHA}" \
              "$ref"
            expected="${ref#*@}"
            actual="sha256:$(docker buildx imagetools inspect --raw "${image}:${GITHUB_REF_NAME}" | sha256sum | awk '{print $1}')"
            test "$actual" = "$expected"
          done
      - name: Assemble immutable release manifest
        run: find . -maxdepth 1 -name '*-image.txt' -type f -print0 | sort -z | xargs -0 cat > release-images.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}-manifest
          path: release-images.txt
          retention-days: 90
